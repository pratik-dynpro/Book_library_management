name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  backend:
    name: backend (lint · migrate · test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: books
          POSTGRES_PASSWORD: books
          POSTGRES_DB: books_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U books -d books_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://books:books@localhost:5432/books_test
      TEST_DATABASE_URL: postgresql+psycopg://books:books@localhost:5432/books_test
      CORS_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check backend

      - name: Alembic migrate
        working-directory: backend
        run: alembic -c alembic.ini upgrade head

      - name: Pytest
        run: pytest backend/tests -q

  frontend:
    name: frontend (lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test -- --run

      - name: Vite build
        run: npm run build

  security:
    name: security (pip-audit · npm audit)
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pip-audit (fails on high)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --requirement backend/requirements.txt --strict

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit (warn only)
        working-directory: frontend
        run: npm audit --omit=dev || true
